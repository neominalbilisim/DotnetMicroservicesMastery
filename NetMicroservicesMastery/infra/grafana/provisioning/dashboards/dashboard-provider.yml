# Modül 1 - Grafana'nın açılışta otomatik olarak yükleyeceği dashboard'ların
# provider tanımı. Bu dosya olmadan aynı klasördeki .json dashboard'lar
# Grafana tarafından fark edilmez.
apiVersion: 1

providers:
  - name: "NetMicroservicesMastery"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
